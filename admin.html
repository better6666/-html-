<!doctype html>
<html lang="zh-CN">

<head>

<meta charset="utf-8">

<meta name="viewport" content="width=device-width,initial-scale=1">

<title>
HTML Cloud 激活码管理后台
</title>


<style>

:root{

--bg:#f6f8fb;

--panel:#fff;

--ink:#17202a;

--muted:#667385;

--line:#dbe4ec;

--teal:#087f8c;

--red:#c24538;

--green:#16805b;

}



*{

box-sizing:border-box;

}



body{

margin:0;

background:var(--bg);

color:var(--ink);

font-family:

-apple-system,

BlinkMacSystemFont,

"Segoe UI",

"PingFang SC",

"Microsoft YaHei",

Arial,

sans-serif;

}



main{

max-width:1100px;

margin:auto;

padding:35px 20px 60px;

}



h1{

font-size:36px;

margin:0 0 10px;

}



.lead{

color:var(--muted);

margin-bottom:25px;

}



.panel{

background:var(--panel);

border:1px solid var(--line);

border-radius:12px;

margin-bottom:18px;

overflow:hidden;

box-shadow:

0 10px 30px rgba(0,0,0,.06);

}



.panel h2{

padding:18px 20px;

margin:0;

border-bottom:1px solid var(--line);

font-size:20px;

}



.body{

padding:20px;

}



label{

display:block;

font-weight:800;

margin-bottom:15px;

}



input,

select{

width:100%;

height:45px;

margin-top:6px;

padding:0 12px;

border:1px solid var(--line);

border-radius:8px;

font-size:15px;

outline:none;

}



input:focus,

select:focus{

border-color:var(--teal);

}



.grid{

display:grid;

grid-template-columns:repeat(2,1fr);

gap:15px;

}



button{

height:45px;

padding:0 18px;

border:0;

border-radius:8px;

background:var(--teal);

color:#fff;

font-weight:900;

cursor:pointer;

}



button.secondary{

background:#eef3f7;

color:var(--ink);

}



button.danger{

background:var(--red);

}



button:disabled{

opacity:.6;

cursor:not-allowed;

}



.actions{

display:flex;

gap:10px;

flex-wrap:wrap;

margin-top:20px;

}



.small{

font-size:13px;

color:var(--muted);

font-weight:400;

}



.status{

margin-top:15px;

font-weight:800;

color:var(--green);

min-height:22px;

}



.status.error{

color:var(--red);

}



textarea{

width:100%;

height:320px;

padding:15px;

border:1px solid var(--line);

border-radius:8px;

font-family:

Consolas,

Monaco,

monospace;

resize:vertical;

}



.table-wrap{

overflow-x:auto;

}



table{

width:100%;

border-collapse:collapse;

}



th,

td{

padding:10px;

border-bottom:1px solid var(--line);

white-space:nowrap;

text-align:left;

}



th{

background:#f7f9fb;

}



.badge{

padding:4px 10px;

border-radius:999px;

font-size:12px;

font-weight:800;

}



.badge.green{

background:#e6f5ef;

color:#126445;

}



.badge.red{

background:#fbe9e7;

color:#8c3028;

}



.badge.gray{

background:#edf1f4;

color:#5d6875;

}



@media(max-width:700px){


.grid{

grid-template-columns:1fr;

}


h1{

font-size:30px;

}


}


</style>

</head>


<body>


<main>


<h1>

激活码管理后台

</h1>


<p class="lead">

HTML网页发布服务卡密管理

</p>
<section class="panel">


<h2>

管理员验证

</h2>



<div class="body">


<label>

管理员密码


<input

id="adminPassword"

type="password"

placeholder="请输入管理员密码"

autocomplete="off"

>


</label>



<div class="small">

密码对应 Cloudflare Worker 环境变量 ADMIN_PASSWORD

</div>



</div>


</section>








<section class="panel">


<h2>

生成激活码

</h2>



<div class="body">


<div class="grid">





<label>

卡密前缀


<input

id="prefix"

value="HTML"

maxlength="12"

>


</label>








<label>

生成数量


<input

id="count"

type="number"

value="10"

min="1"

max="5000"

>


</label>








<label>

卡类型


<select id="plan">


<option value="count">

次卡

</option>


<option value="hour">

小时卡

</option>


<option value="day">

日卡

</option>


<option value="week">

周卡

</option>


<option value="month">

月卡

</option>


<option value="forever">

永久卡

</option>


</select>


</label>









<label>

有效时间


<input

id="duration"

type="number"

value="1"

min="1"

>


<span class="small">

小时卡=小时，日卡=天，月卡=月

</span>


</label>








<label>

使用次数


<input

id="uses"

type="number"

value="1"

min="1"

max="999999"

>


<span class="small">

次卡使用次数

</span>


</label>








<label>

批次


<input

id="batch"

value="2026-08"

>


</label>








<label>

随机组长度


<select id="groupSize">


<option value="4">

4位

</option>


<option value="5">

5位

</option>


<option value="6">

6位

</option>


</select>


</label>








<label>

随机组数量


<select id="groups">


<option value="3">

3组

</option>


<option value="4" selected>

4组

</option>


<option value="5">

5组

</option>


</select>


</label>






</div>







<div class="actions">



<button

id="generateBtn"

type="button"

>

批量生成并保存KV

</button>






<button

id="copyBtn"

type="button"

class="secondary"

>

复制卡密

</button>






<button

id="csvBtn"

type="button"

class="secondary"

>

下载CSV

</button>






<button

id="clearBtn"

type="button"

class="danger"

>

清空显示

</button>



</div>







<div

id="status"

class="status">

</div>





</div>


</section>








<section class="panel">


<h2>

生成结果

</h2>



<div class="body">


<textarea

id="output"

placeholder="生成成功后显示激活码">

</textarea>


</div>


</section>








<section class="panel">


<h2>

查询激活码

</h2>



<div class="body">


<div class="grid">


<input

id="searchCode"

placeholder="输入完整激活码"

>



<button

id="searchBtn"

type="button"

>

查询

</button>



</div>




<div

id="searchStatus"

class="status">

</div>



</div>


</section>

</main>

<script>
/*
========================
Worker地址
========================
*/

const WORKER_URL =
"https://html-uploader.2333333434.workers.dev";



/*
========================
获取元素
========================
*/

const adminPassword =
document.querySelector("#adminPassword");

const prefix =
document.querySelector("#prefix");

const count =
document.querySelector("#count");

const plan =
document.querySelector("#plan");

const duration =
document.querySelector("#duration");

const uses =
document.querySelector("#uses");

const batch =
document.querySelector("#batch");

const groupSize =
document.querySelector("#groupSize");

const groups =
document.querySelector("#groups");

const output =
document.querySelector("#output");

const status =
document.querySelector("#status");





/*
========================
状态显示
========================
*/

function setStatus(
text,
error=false
){

status.innerText=text;

status.className =
error
?
"status error"
:
"status";

}








/*
========================
生成激活码
========================
*/


document
.querySelector("#generateBtn")
.addEventListener(
"click",
async()=>{



const password =
adminPassword.value.trim();



if(!password){


setStatus(
"请输入管理员密码",
true
);


return;

}




const payload={



prefix:

prefix.value
.trim()
.toUpperCase()
.replace(
/[^A-Z0-9]/g,
""
)
||
"HTML",




count:

Math.min(
Number(count.value)||1,
5000
),




plan:

plan.value,




duration:

Number(duration.value)||1,




uses:

Number(uses.value)||1,




batch:

batch.value.trim()
||
"default",




groupSize:

Number(groupSize.value)||4,




groups:

Number(groups.value)||4



};







const btn =
document.querySelector("#generateBtn");



btn.disabled=true;


btn.innerText=
"生成中...";



setStatus(
"正在请求Worker..."
);






try{



const response =
await fetch(

WORKER_URL+
"/admin/generate",

{

method:"POST",


headers:{


"Content-Type":
"application/json",


"Authorization":
"Bearer "+
password


},


body:
JSON.stringify(payload)

}

);







const text =
await response.text();




let data;



try{


data =
JSON.parse(text);


}

catch(e){


throw new Error(
"Worker返回错误："+text
);


}








if(
!response.ok
||
!data.success
){



throw new Error(
data.error ||
"生成失败"
);



}








output.value =
(data.codes||[])
.join("\n");







setStatus(

"成功生成 "+
(data.codes||[]).length+
" 个激活码"

);





}

catch(error){



console.error(error);



setStatus(

error.message,

true

);



}

finally{



btn.disabled=false;


btn.innerText=
"批量生成并保存KV";


}



}

);









/*
========================
复制
========================
*/


document
.querySelector("#copyBtn")
.addEventListener(
"click",
async()=>{



if(
!output.value.trim()
){



setStatus(
"没有激活码",
true
);


return;


}






try{



await navigator.clipboard.writeText(

output.value

);



setStatus(
"复制成功"
);



}

catch(e){



setStatus(
"复制失败，请手动复制",
true
);



}



}

);









/*
========================
清空
========================
*/


document
.querySelector("#clearBtn")
.addEventListener(
"click",
()=>{



output.value="";



setStatus(
"已清空"
);



}

);
/*
========================
CSV导出
========================
*/


document
.querySelector("#csvBtn")
.addEventListener(
"click",
()=>{


const codes =

output.value

.split("\n")

.map(
x=>x.trim()
)

.filter(Boolean);



if(!codes.length){


setStatus(
"没有激活码可以导出",
true
);


return;


}



let rows=[

[
"code",
"plan",
"duration",
"uses",
"batch"
]

];




for(const code of codes){


rows.push([

code,

plan.value,

duration.value,

uses.value,

batch.value

]);


}





const csv =

rows

.map(

row=>

row
.map(
v=>

`"${String(v)
.replaceAll('"','""')}"`
)

.join(",")

)

.join("\n");






const blob =

new Blob(

[

"\ufeff"+csv

],

{

type:

"text/csv;charset=utf-8"

}

);





const url =

URL.createObjectURL(blob);




const a =

document.createElement("a");



a.href=url;


a.download=

"activation-codes-"+

Date.now()+

".csv";



a.click();



URL.revokeObjectURL(url);



setStatus(
"CSV导出成功"
);



}

);









/*
========================
查询激活码
========================
*/


document
.querySelector("#searchBtn")
.addEventListener(
"click",
async()=>{



const password =

adminPassword.value.trim();



const code =

document
.querySelector("#searchCode")
.value
.trim();





if(!password){


document
.querySelector("#searchStatus")
.innerText=
"请输入管理员密码";


return;


}




if(!code){


document
.querySelector("#searchStatus")
.innerText=
"请输入激活码";


return;


}





try{



const response =

await fetch(

WORKER_URL+

"/admin/check?code="+

encodeURIComponent(code),

{


headers:{


"Authorization":

"Bearer "+password


}

}

);






const text =

await response.text();



let data;



try{


data=JSON.parse(text);


}

catch(e){


throw new Error(
"Worker返回错误："+text
);


}






if(
!response.ok
||
!data.success
){


throw new Error(

data.error||

"查询失败"

);


}






const item=data.data;




document
.querySelector("#searchStatus")
.innerText=
"查询成功";





alert(

`
激活码：${item.code}

类型：${item.plan}

剩余次数：${item.remaining}

到期时间：${item.expire_at || "永久"}

状态：${item.status}

`

);






}

catch(error){



document
.querySelector("#searchStatus")
.innerText=
error.message;



}



}

);







</script>


</body>


</html>

<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>HTML Cloud - 激活码管理</title>
  <style>
    :root {
      --teal: #087f8c;
      --teal-dark: #06616b;
      --ink: #17202a;
      --muted: #667385;
      --line: #d9e2e9;
      --surface: #fff;
      --bg: #f4f7f9;
      --success: #147554;
      --danger: #b83b31;
    }
    * { box-sizing: border-box; }
    body { margin: 0; color: var(--ink); background: var(--bg); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", Arial, sans-serif; line-height: 1.55; }
    button, input, select, textarea { font: inherit; }
    button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible { outline: 3px solid rgba(8, 127, 140, 0.22); outline-offset: 2px; }
    header { border-bottom: 1px solid var(--line); background: #fff; }
    .bar { display: flex; align-items: center; justify-content: space-between; width: min(1120px, calc(100% - 32px)); min-height: 64px; margin: auto; }
    .brand { display: flex; gap: 10px; align-items: center; font-weight: 850; }
    .mark { display: grid; place-items: center; width: 36px; height: 36px; border-radius: 7px; color: #fff; background: var(--teal); }
    .env { color: var(--muted); font-size: 12px; }
    main { width: min(1120px, calc(100% - 32px)); margin: 30px auto 60px; }
    .heading { margin-bottom: 24px; }
    h1 { margin: 0 0 4px; font-size: 30px; letter-spacing: 0; }
    .heading p { margin: 0; color: var(--muted); }
    .layout { display: grid; grid-template-columns: minmax(0, 1.1fr) minmax(320px, 0.9fr); gap: 18px; align-items: start; }
    .panel { border: 1px solid var(--line); border-radius: 8px; background: var(--surface); overflow: hidden; }
    .panel + .panel { margin-top: 18px; }
    .panel-head { padding: 17px 19px; border-bottom: 1px solid var(--line); }
    .panel-head h2 { margin: 0; font-size: 18px; }
    .panel-head p { margin: 3px 0 0; color: var(--muted); font-size: 12px; }
    .panel-body { padding: 19px; }
    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
    .field { display: grid; gap: 6px; }
    .field.full { grid-column: 1 / -1; }
    label { font-size: 13px; font-weight: 800; }
    input, select, textarea { width: 100%; border: 1px solid #cdd8e0; border-radius: 7px; color: var(--ink); background: #fff; }
    input, select { height: 44px; padding: 0 11px; }
    textarea { min-height: 245px; padding: 12px; resize: vertical; font-family: "SFMono-Regular", Consolas, monospace; font-size: 13px; }
    .hint { color: var(--muted); font-size: 11px; }
    .actions { display: flex; gap: 9px; flex-wrap: wrap; margin-top: 16px; }
    button { min-height: 42px; padding: 0 15px; border: 1px solid transparent; border-radius: 7px; cursor: pointer; font-weight: 800; }
    button:disabled { cursor: not-allowed; opacity: 0.55; }
    .primary { color: #fff; background: var(--teal); }
    .primary:hover { background: var(--teal-dark); }
    .secondary { color: var(--ink); border-color: var(--line); background: #fff; }
    .danger { color: #fff; background: var(--danger); }
    .status { min-height: 23px; margin-top: 12px; color: var(--muted); font-size: 13px; }
    .status.success { color: var(--success); font-weight: 700; }
    .status.error { color: var(--danger); font-weight: 700; }
    .record { margin-top: 16px; padding: 13px; border: 1px solid var(--line); border-radius: 7px; background: #f8fafb; }
    .record.hidden { display: none; }
    dl { display: grid; grid-template-columns: 105px 1fr; gap: 8px 12px; margin: 0; font-size: 13px; }
    dt { color: var(--muted); }
    dd { margin: 0; overflow-wrap: anywhere; font-weight: 700; }
    .record .actions { padding-top: 12px; border-top: 1px solid var(--line); }
    .page-list { display: grid; gap: 8px; margin-top: 14px; }
    .page-row { padding: 10px; border: 1px solid var(--line); border-radius: 7px; background: #fff; }
    .page-row strong, .page-row a { display: block; overflow-wrap: anywhere; }
    .page-row a { color: var(--teal-dark); font-size: 12px; }
    .page-row time { color: var(--muted); font-size: 11px; }
    @media (max-width: 820px) { .layout { grid-template-columns: 1fr; } }
    @media (max-width: 560px) { main, .bar { width: min(100% - 24px, 1120px); } .grid { grid-template-columns: 1fr; } .field.full { grid-column: auto; } h1 { font-size: 25px; } button { flex: 1; } dl { grid-template-columns: 90px 1fr; } }
  </style>
</head>
<body>
  <header><div class="bar"><div class="brand"><span class="mark">H</span><span>HTML Cloud 管理台</span></div><span class="env">Cloudflare Worker</span></div></header>
  <main>
    <div class="heading"><h1>激活码与账号管理</h1><p>生成卡密、处理状态并查询账号发布记录。</p></div>
    <div class="layout">
      <div>
        <section class="panel">
          <div class="panel-head"><h2>生成激活码</h2><p>单次最多 50 个，降低 Worker 批量写入失败风险。</p></div>
          <div class="panel-body">
            <div class="grid">
              <div class="field full"><label for="adminPassword">管理员密码</label><input id="adminPassword" type="password" autocomplete="current-password" placeholder="ADMIN_PASSWORD"></div>
              <div class="field"><label for="prefix">卡密前缀</label><input id="prefix" value="HTML" maxlength="12"></div>
              <div class="field"><label for="count">生成数量</label><input id="count" type="number" value="10" min="1" max="50"></div>
              <div class="field"><label for="plan">卡类型</label><select id="plan"><option value="count">次卡</option><option value="hour">小时卡</option><option value="day">日卡</option><option value="week">周卡</option><option value="month">月卡</option><option value="quarter">三个月卡</option><option value="halfyear">半年卡</option><option value="year">一年卡</option><option value="forever">永久卡</option></select></div>
              <div class="field"><label for="duration">有效时长</label><input id="duration" type="number" value="1" min="1" max="3650"><span class="hint" id="durationHint">时间卡从账号注册成功开始计时</span></div>
              <div class="field"><label for="uses">可用次数</label><input id="uses" type="number" value="10" min="1" max="100000"><span class="hint">仅次卡使用此设置</span></div>
              <div class="field"><label for="batch">批次</label><input id="batch" value="default" maxlength="80"></div>
              <div class="field"><label for="groupSize">每组字符</label><input id="groupSize" type="number" value="4" min="3" max="8"></div>
              <div class="field"><label for="groups">分组数量</label><input id="groups" type="number" value="4" min="3" max="8"></div>
            </div>
            <div class="actions"><button class="primary" id="generateBtn" type="button">生成并保存</button></div>
            <div class="status" id="generateStatus" role="status" aria-live="polite"></div>
          </div>
        </section>
      </div>

      <div>
        <section class="panel">
          <div class="panel-head"><h2>生成结果</h2><p>只展示本次生成的激活码。</p></div>
          <div class="panel-body">
            <textarea id="output" readonly aria-label="生成的激活码"></textarea>
            <div class="actions"><button class="primary" id="copyBtn" type="button">复制</button><button class="secondary" id="csvBtn" type="button">导出 CSV</button><button class="secondary" id="clearBtn" type="button">清空</button></div>
          </div>
        </section>

        <section class="panel">
          <div class="panel-head"><h2>查询与售后处理</h2><p>绑定账号不可转移；可作废或恢复卡密。</p></div>
          <div class="panel-body">
            <div class="field"><label for="searchCode">激活码</label><input id="searchCode" autocomplete="off" autocapitalize="characters" placeholder="输入完整激活码"></div>
            <div class="actions"><button class="primary" id="searchBtn" type="button">查询</button></div>
            <div class="status" id="searchStatus" role="status" aria-live="polite"></div>
            <div class="record hidden" id="record">
              <dl>
                <dt>激活码</dt><dd id="rCode">-</dd>
                <dt>状态</dt><dd id="rStatus">-</dd>
                <dt>类型</dt><dd id="rPlan">-</dd>
                <dt>剩余/已用</dt><dd id="rUsage">-</dd>
                <dt>到期时间</dt><dd id="rExpire">-</dd>
                <dt>绑定账号</dt><dd id="rAccount">-</dd>
                <dt>账号绑定时间</dt><dd id="rAccountAt">-</dd>
              </dl>
              <div class="actions"><button class="danger" id="revokeBtn" type="button">作废</button><button class="secondary" id="activateBtn" type="button">恢复</button></div>
            </div>
          </div>
        </section>

        <section class="panel">
          <div class="panel-head"><h2>账号与网页记录</h2><p>可输入账号名或已经绑定的激活码。</p></div>
          <div class="panel-body">
            <div class="field"><label for="accountQuery">账号或激活码</label><input id="accountQuery" autocomplete="off" placeholder="username / HTML-..."></div>
            <div class="actions"><button class="primary" id="accountBtn" type="button">查询账号</button></div>
            <div class="status" id="accountStatus" role="status" aria-live="polite"></div>
            <div class="record hidden" id="accountRecord">
              <dl>
                <dt>账号</dt><dd id="aUsername">-</dd>
                <dt>激活码</dt><dd id="aLicense">-</dd>
                <dt>注册时间</dt><dd id="aCreated">-</dd>
                <dt>最后登录</dt><dd id="aLastLogin">-</dd>
                <dt>最近设备</dt><dd id="aDevice">-</dd>
                <dt>IP 哈希</dt><dd id="aIp">-</dd>
              </dl>
              <div class="page-list" id="accountPages"></div>
            </div>
          </div>
        </section>
      </div>
    </div>
  </main>

  <script>
    const WORKER_URL = "https://api.better666.dpdns.org";
    const $ = (selector) => document.querySelector(selector);
    const fields = ["prefix", "count", "plan", "duration", "uses", "batch", "groupSize", "groups"].reduce((all, id) => ({ ...all, [id]: $(`#${id}`) }), {});
    const adminPassword = $("#adminPassword");
    const output = $("#output");
    const generateStatus = $("#generateStatus");
    const searchStatus = $("#searchStatus");
    const record = $("#record");
    const accountStatus = $("#accountStatus");
    const accountRecord = $("#accountRecord");
    let currentRecord = null;

    function setStatus(element, text, type = "") {
      element.textContent = text;
      element.className = `status${type ? ` ${type}` : ""}`;
    }

    function planLabel(plan) {
      return ({ count: "次卡", hour: "小时卡", day: "日卡", week: "周卡", month: "月卡", quarter: "三个月卡", halfyear: "半年卡", year: "一年卡", forever: "永久卡" })[plan] || plan;
    }

    function syncDuration() {
      const fixed = { quarter: 3, halfyear: 6, year: 12 }[fields.plan.value];
      fields.duration.disabled = fixed !== undefined;
      if (fixed !== undefined) {
        fields.duration.value = fixed;
        $("#durationHint").textContent = `${planLabel(fields.plan.value)}固定为 ${fixed} 个月，注册成功后开始计时`;
      } else {
        $("#durationHint").textContent = "时间卡从账号注册成功开始计时";
      }
    }

    fields.plan.addEventListener("change", syncDuration);
    syncDuration();

    async function request(path, body) {
      const password = adminPassword.value.trim();
      if (!password) throw new Error("请输入管理员密码");
      const response = await fetch(`${WORKER_URL}${path}`, {
        method: "POST",
        headers: { "Content-Type": "application/json", "Authorization": `Bearer ${password}` },
        body: JSON.stringify(body)
      });
      const text = await response.text();
      let data;
      try { data = JSON.parse(text); } catch { throw new Error("服务返回了无法识别的内容"); }
      if (!response.ok || !data.success) throw new Error(data.error || "操作失败");
      return data;
    }

    $("#generateBtn").addEventListener("click", async () => {
      const button = $("#generateBtn");
      const payload = {
        prefix: fields.prefix.value.trim(), count: Number(fields.count.value), plan: fields.plan.value,
        duration: Number(fields.duration.value), uses: Number(fields.uses.value), batch: fields.batch.value.trim(),
        groupSize: Number(fields.groupSize.value), groups: Number(fields.groups.value)
      };
      button.disabled = true;
      button.textContent = "生成中...";
      setStatus(generateStatus, "正在创建激活码...");
      try {
        const data = await request("/admin/generate", payload);
        output.value = data.codes.join("\n");
        setStatus(generateStatus, `已生成 ${data.codes.length} 个激活码`, "success");
      } catch (error) { setStatus(generateStatus, error.message, "error"); }
      finally { button.disabled = false; button.textContent = "生成并保存"; }
    });

    $("#copyBtn").addEventListener("click", async () => {
      if (!output.value.trim()) return setStatus(generateStatus, "没有可复制的激活码", "error");
      try { await navigator.clipboard.writeText(output.value); setStatus(generateStatus, "已复制", "success"); }
      catch { setStatus(generateStatus, "复制失败，请手动复制", "error"); }
    });

    $("#clearBtn").addEventListener("click", () => { output.value = ""; setStatus(generateStatus, "已清空"); });

    $("#csvBtn").addEventListener("click", () => {
      const codes = output.value.split("\n").map((value) => value.trim()).filter(Boolean);
      if (!codes.length) return setStatus(generateStatus, "没有可导出的激活码", "error");
      const rows = [["code", "plan", "duration", "uses", "batch"], ...codes.map((code) => [code, planLabel(fields.plan.value), fields.duration.value, fields.uses.value, fields.batch.value])];
      const csv = rows.map((row) => row.map((value) => `"${String(value).replaceAll('"', '""')}"`).join(",")).join("\n");
      const url = URL.createObjectURL(new Blob(["\ufeff" + csv], { type: "text/csv;charset=utf-8" }));
      const link = document.createElement("a");
      link.href = url;
      link.download = `activation-codes-${Date.now()}.csv`;
      link.click();
      URL.revokeObjectURL(url);
      setStatus(generateStatus, "CSV 已导出", "success");
    });

    function dateText(value) { return value ? new Date(value).toLocaleString("zh-CN") : "-"; }
    function renderRecord(item) {
      currentRecord = item;
      $("#rCode").textContent = item.code;
      $("#rStatus").textContent = item.status === "revoked" ? "已作废" : "正常";
      $("#rPlan").textContent = planLabel(item.plan);
      $("#rUsage").textContent = item.plan === "count" ? `${item.remaining} / ${item.used || 0}` : "不限";
      $("#rExpire").textContent = item.plan === "count" ? "按次数" : (item.expire_at ? dateText(item.expire_at) : "注册后起算");
      $("#rAccount").textContent = item.account_username || "未绑定";
      $("#rAccountAt").textContent = dateText(item.account_bound_at);
      $("#revokeBtn").disabled = item.status === "revoked";
      $("#activateBtn").disabled = item.status !== "revoked";
      record.classList.remove("hidden");
    }

    async function search() {
      const code = $("#searchCode").value.trim().toUpperCase();
      if (!code) throw new Error("请输入激活码");
      const data = await request("/admin/check", { code });
      renderRecord(data.data);
      setStatus(searchStatus, "查询成功", "success");
    }

    $("#searchBtn").addEventListener("click", async () => {
      record.classList.add("hidden");
      setStatus(searchStatus, "正在查询...");
      try { await search(); } catch (error) { setStatus(searchStatus, error.message, "error"); }
    });

    async function adminAction(operation, pendingText) {
      if (!currentRecord) return;
      setStatus(searchStatus, pendingText);
      try {
        const data = await request("/admin/action", { code: currentRecord.code, operation });
        renderRecord(data.data);
        setStatus(searchStatus, "操作成功", "success");
      } catch (error) { setStatus(searchStatus, error.message, "error"); }
    }

    $("#revokeBtn").addEventListener("click", () => adminAction("revoke", "正在作废..."));
    $("#activateBtn").addEventListener("click", () => adminAction("activate", "正在恢复..."));

    function renderAccount(data) {
      const account = data.account;
      $("#aUsername").textContent = account.username;
      $("#aLicense").textContent = account.license_code;
      $("#aCreated").textContent = dateText(account.created_at);
      $("#aLastLogin").textContent = dateText(account.last_login_at);
      $("#aDevice").textContent = account.last_device || "-";
      $("#aIp").textContent = account.last_ip_hash || "-";
      const pages = $("#accountPages");
      pages.replaceChildren();
      if (!data.pages.length) {
        const empty = document.createElement("div");
        empty.className = "page-row";
        empty.textContent = "该账号还没有发布网页";
        pages.append(empty);
      } else {
        for (const page of data.pages) {
          const row = document.createElement("article");
          row.className = "page-row";
          const title = document.createElement("strong");
          title.textContent = page.title;
          const link = document.createElement("a");
          link.href = page.url;
          link.target = "_blank";
          link.rel = "noopener noreferrer";
          link.textContent = page.url;
          const time = document.createElement("time");
          time.dateTime = page.created_at;
          time.textContent = dateText(page.created_at);
          row.append(title, link, time);
          pages.append(row);
        }
      }
      accountRecord.classList.remove("hidden");
    }

    $("#accountBtn").addEventListener("click", async () => {
      const query = $("#accountQuery").value.trim();
      accountRecord.classList.add("hidden");
      if (!query) return setStatus(accountStatus, "请输入账号或激活码", "error");
      setStatus(accountStatus, "正在查询...");
      try {
        const data = await request("/admin/account", { query });
        renderAccount(data);
        setStatus(accountStatus, `查询成功，共 ${data.pages.length} 个网页`, "success");
      } catch (error) { setStatus(accountStatus, error.message, "error"); }
    });
  </script>
</body>
</html>
